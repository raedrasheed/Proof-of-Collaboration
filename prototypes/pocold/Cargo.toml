[package]
name = "pocold"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "PoCol local development node: consensus, mining, persistence, P2P and RPC over the LP4 execution layer. Local simnet devnets only."

[dependencies]
pocol-lp4-execution = { path = "../lp4-execution" }
revm = { version = "=19.7.0", features = ["serde"] }
serde_json = "=1.0.145"
sha2 = "=0.9.9"
sha3 = "=0.9.1"
libsecp256k1 = "=0.5.0"

[profile.release]
debug = 1
