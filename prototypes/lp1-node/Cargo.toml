[package]
name = "lp1-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.58"
publish = false
license = "Apache-2.0"
description = "LP1: local experimental PoCol M3-foundation slice (fixture header chain, RP window, read-only loopback JSON-RPC). Not a production node."

[lib]
name = "lp1_node"
path = "src/lib.rs"

[[bin]]
name = "lp1-node"
path = "src/main.rs"

[[test]]
# Runs serially in its own process (no libtest threads) so the global allocation counter only sees ASERT.
name = "asert_alloc"
path = "tests/asert_alloc.rs"
harness = false

[[test]]
# Counting global allocator; runs without libtest so only the measured thread allocates.
name = "genesis_batch_alloc"
path = "tests/genesis_batch_alloc.rs"
harness = false

[dependencies]
# Exact versions already cached on the root machine; offline build with the lock file root generates.
sha2 = "=0.9.9"
sha3 = "=0.9.1"
libsecp256k1 = "=0.5.0"
serde_json = "=1.0.79"
