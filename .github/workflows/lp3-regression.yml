name: LP3 integrated Windows regression
on:
  pull_request:
    branches: [work/lp3-consensus-foundation]
    paths: ['prototypes/lp1-node/**', '.github/workflows/lp3-regression.yml', '.github/scripts/lp3-s1-windows-verify.ps1']
permissions:
  contents: read
jobs:
  windows-regression:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Full Rust, Windows journal/crash and process regression
        shell: pwsh
        env:
          INCLUDE_SLOW: 'false'
          EVIDENCE_DIR: ${{ runner.temp }}\lp3-evidence
        run: ./.github/scripts/lp3-s1-windows-verify.ps1 -Evidence $env:EVIDENCE_DIR
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lp3-s8-windows-evidence
          path: ${{ runner.temp }}\lp3-evidence
          if-no-files-found: error
          retention-days: 14
