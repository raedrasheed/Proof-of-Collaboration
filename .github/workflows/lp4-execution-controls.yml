# Diagnostic/primitive checks only: no job success implies LP4/T2/T2b acceptance.
name: LP4 execution controls
on:
  pull_request:
    branches: [work/lp3-consensus-foundation]
    paths: ['prototypes/lp4-execution/**', '.github/workflows/lp4-execution-controls.yml']
permissions:
  contents: read
jobs:
  cancun-pay-controls:
    runs-on: ubuntu-24.04
    env:
      CARGO_HOME: ${{ runner.temp }}/lp4-execution-cargo
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned experimental toolchain and comparison tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          python -m venv work/lp4-venv
          work/lp4-venv/bin/pip install -r prototypes/lp4-execution/tests/python-requirements.lock
          npm ci --prefix prototypes/lp4-execution/tools --ignore-scripts --no-audit --no-fund
      - name: Verify locked source archives and prepare default-runtime notices
        run: |
          set -euo pipefail
          cargo +1.99.1 fetch --locked --manifest-path prototypes/lp4-execution/Cargo.toml
          cargo +1.99.1 tree --offline --locked --manifest-path prototypes/lp4-execution/Cargo.toml --target all -e normal,build --prefix none --format '{p}' > work/lp4-active-packages.txt
          python prototypes/lp4-execution/tests/source_inventory.py "$CARGO_HOME" work/lp4-source-inventory.json
          python prototypes/lp4-execution/tests/source_notice_audit.py "$CARGO_HOME" work/lp4-active-packages.txt development/lp4/p2-runtime/codex-r9/upstream-license-grants.json work/lp4-runtime-notices
      - name: Reproduce compiler output and run actual Rust execution tests
        run: |
          set -euo pipefail
          mkdir -p work/lp4-controls
          NODE_PATH="$PWD/prototypes/lp4-execution/tools/node_modules" node prototypes/lp4-execution/tests/compile_contracts.cjs work/lp4-controls/pay-harness.json
          cmp prototypes/lp4-execution/tests/data/pay-harness.json work/lp4-controls/pay-harness.json
          NODE_PATH="$PWD/prototypes/lp4-execution/tools/node_modules" node prototypes/lp4-execution/tests/compile_durability.cjs work/lp4-controls/reward-durability.json
          cmp prototypes/lp4-execution/tests/data/reward-durability.json work/lp4-controls/reward-durability.json
          NODE_PATH="$PWD/prototypes/lp4-execution/tools/node_modules" node prototypes/lp4-execution/tests/compile_budget_witness.cjs work/lp4-controls/registry-write-budget.json
          cmp prototypes/lp4-execution/tests/data/registry-write-budget.json work/lp4-controls/registry-write-budget.json
          NODE_PATH="$PWD/prototypes/lp4-execution/tools/node_modules" node prototypes/lp4-execution/tests/compile_registry.cjs work/lp4-controls/registry-payment.json
          cmp prototypes/lp4-execution/tests/data/registry-payment.json work/lp4-controls/registry-payment.json
          cargo +1.99.1 test --locked --manifest-path prototypes/lp4-execution/Cargo.toml 2>&1 | tee work/lp4-controls/rust-tests.log
          cargo +1.99.1 run --locked --manifest-path prototypes/lp4-execution/Cargo.toml --example pay_vectors > work/lp4-controls/pay-vectors.json
          work/lp4-venv/bin/python prototypes/lp4-execution/tests/pay_oracle.py work/lp4-controls/pay-vectors.json prototypes/lp4-execution/tests/data/pay-harness.json work/lp4-controls/pay-oracle.json
          cargo +1.99.1 run --locked --manifest-path prototypes/lp4-execution/Cargo.toml --example lifecycle_vectors > work/lp4-controls/lifecycle-vectors.json
          work/lp4-venv/bin/python prototypes/lp4-execution/tests/lifecycle_oracle.py work/lp4-controls/lifecycle-vectors.json prototypes/lp4-execution/tests/data/reward-durability.json work/lp4-controls/lifecycle-oracle.json
          cargo +1.99.1 run --locked --manifest-path prototypes/lp4-execution/Cargo.toml --example registry_write_budget > work/lp4-controls/registry-write-vectors.json
          work/lp4-venv/bin/python prototypes/lp4-execution/tests/registry_budget_oracle.py work/lp4-controls/registry-write-vectors.json prototypes/lp4-execution/tests/data/registry-write-budget.json work/lp4-controls/registry-write-counts.json
          cargo +1.99.1 run --locked --manifest-path prototypes/lp4-execution/Cargo.toml --example registry_vectors > work/lp4-controls/registry-vectors.json
          work/lp4-venv/bin/python prototypes/lp4-execution/tests/registry_execution_oracle.py work/lp4-controls/registry-vectors.json work/lp4-controls/registry-oracle.json
      - name: Compile PAY mutation controls
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: python prototypes/lp4-execution/tests/pay_mutations.py work/lp4-mutations
      - name: Compile approved CREATE collision mutation controls
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: python prototypes/lp4-execution/tests/create_mutations.py work/lp4-create-mutations
      - name: Compile write-budget contradiction controls (not Registry acceptance)
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: NODE_PATH="$PWD/prototypes/lp4-execution/tools/node_modules" python prototypes/lp4-execution/tests/registry_budget_mutations.py work/lp4-budget-mutations
      - name: Compile actual Registry and bridge mutation controls
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: NODE_PATH="$PWD/prototypes/lp4-execution/tools/node_modules" python prototypes/lp4-execution/tests/registry_mutations.py work/lp4-registry-mutations
      - name: Complete pinned upstream Cancun control corpus
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 300 https://codeload.github.com/ethereum/legacytests/tar.gz/1f581b8ccdc4c63acf5f2c5c1b155c690c32a8eb -o work/legacy.tar.gz
          work/lp4-venv/bin/python prototypes/lp4-execution/tests/gst_extract.py work/legacy.tar.gz work/gst-corpus development/lp4/p2-runtime/codex-r2/source-receipts.json
          cargo +1.99.1 build --locked --release --manifest-path prototypes/lp4-execution/Cargo.toml --bin cancun_control
          work/lp4-venv/bin/python prototypes/lp4-execution/tests/gst_control.py work/gst-corpus prototypes/lp4-execution/target/release/cancun_control work/lp4-controls/gst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lp4-p2-controls
          path: |
            work/lp4-controls
            work/lp4-runtime-notices
            work/lp4-source-inventory.json
            work/lp4-active-packages.txt
            work/lp4-mutations/*.log
            work/lp4-mutations/results.json
            work/lp4-create-mutations/*.log
            work/lp4-create-mutations/results.json
            work/lp4-budget-mutations/*.log
            work/lp4-budget-mutations/results.json
            work/lp4-registry-mutations/*.log
            work/lp4-registry-mutations/results.json
          if-no-files-found: error
          retention-days: 14
  legacy-windows-regression:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Preserved full legacy Windows verification
        shell: pwsh
        env:
          INCLUDE_SLOW: 'false'
          EVIDENCE_DIR: ${{ runner.temp }}\lp4-legacy-evidence
        run: ./.github/scripts/lp3-s1-windows-verify.ps1 -Evidence $env:EVIDENCE_DIR
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lp4-legacy-windows
          path: ${{ runner.temp }}\lp4-legacy-evidence
          if-no-files-found: error
          retention-days: 14
  registry-windows-execution:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Actual pinned native execution on Windows
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force work/lp4-native-windows | Out-Null
          cargo +1.99.1 test --locked --manifest-path prototypes/lp4-execution/Cargo.toml 2>&1 | Tee-Object work/lp4-native-windows/rust-tests.log
          $lp4NativeExit = $LASTEXITCODE
          if ($lp4NativeExit -ne 0) { exit $lp4NativeExit }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lp4-native-windows
          path: work/lp4-native-windows
          if-no-files-found: error
          retention-days: 14
